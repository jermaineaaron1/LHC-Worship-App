<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LHC Icon Generator — run once</title>
  <style>
    body { font-family: sans-serif; background: #f0f4ff; padding: 24px; color: #1f2933; }
    h1   { color: #4a6da7; margin-bottom: 8px; }
    .note {
      background: white; border-left: 4px solid #4a6da7;
      border-radius: 8px; padding: 14px 18px;
      margin-bottom: 24px; font-size: .9rem; line-height: 1.6;
    }
    code { background: #e8eef8; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
    .grid { display: flex; flex-wrap: wrap; gap: 16px; }
    .card {
      background: white; border-radius: 12px;
      padding: 16px; text-align: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      min-width: 140px;
    }
    canvas { display: block; margin: 0 auto 8px; border-radius: 10px; }
    .size-label  { font-size: .78rem; color: #888; }
    .name-label  { font-size: .72rem; font-family: monospace; color: #4a6da7; margin-bottom: 8px; }
    button {
      padding: 6px 16px; background: #4a6da7; color: white;
      border: none; border-radius: 6px; cursor: pointer; font-size: .82rem;
    }
    button:hover { background: #3a5d97; }
    #dlAll {
      display: block; margin-bottom: 24px;
      padding: 10px 24px; font-size: .95rem;
      background: #4a6da7; color: white;
      border: none; border-radius: 8px; cursor: pointer;
    }
    #dlAll:hover { background: #3a5d97; }
  </style>
</head>
<body>
  <h1>LHC Worship — Icon Generator</h1>
  <div class="note">
    <strong>Instructions:</strong> Click <em>Download All</em> (or each button individually).
    Save the downloaded PNG files into your <code>pwa-shell/icons/</code> folder
    using the exact filenames shown. You only need to do this once.
  </div>

  <button id="dlAll">⬇ Download All Icons</button>
  <div class="grid" id="grid"></div>

  <script>
    const SVG_SRC = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <rect width="512" height="512" fill="#4a6da7"/>
      <rect x="36" y="36" width="440" height="440" rx="88" fill="#3a5d97"/>
      <rect x="220" y="76" width="72" height="360" rx="16" fill="white"/>
      <rect x="96" y="184" width="320" height="72" rx="16" fill="white"/>
      <g opacity="0.40" transform="translate(302,282) scale(0.9)">
        <ellipse cx="18" cy="58" rx="15" ry="11" fill="white" transform="rotate(-18,18,58)"/>
        <rect x="30" y="12" width="6" height="48" rx="3" fill="white"/>
        <path d="M36 12 Q62 6 62 28 Q62 42 36 42 Z" fill="white"/>
      </g>
    </svg>`;

    const SIZES = [
      { size: 72,  name: 'icon-72.png' },
      { size: 96,  name: 'icon-96.png' },
      { size: 128, name: 'icon-128.png' },
      { size: 144, name: 'icon-144.png' },
      { size: 152, name: 'icon-152.png' },
      { size: 180, name: 'apple-touch-icon.png' },
      { size: 192, name: 'icon-192.png' },
      { size: 384, name: 'icon-384.png' },
      { size: 512, name: 'icon-512.png' },
    ];

    const blob   = new Blob([SVG_SRC], { type: 'image/svg+xml' });
    const svgUrl = URL.createObjectURL(blob);
    const img    = new Image();
    const cards  = [];

    function downloadCanvas(canvas, filename) {
      const a = document.createElement('a');
      a.download = filename;
      a.href = canvas.toDataURL('image/png');
      a.click();
    }

    function makeCanvas(size) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      c.getContext('2d').drawImage(img, 0, 0, size, size);
      return c;
    }

    img.onload = () => {
      const grid = document.getElementById('grid');
      SIZES.forEach(({ size, name }) => {
        const preview = makeCanvas(Math.min(size, 96));
        const card = document.createElement('div');
        card.className = 'card';
        const sl = document.createElement('div'); sl.className = 'size-label'; sl.textContent = `${size}×${size}`;
        const nl = document.createElement('div'); nl.className = 'name-label'; nl.textContent = name;
        const btn = document.createElement('button'); btn.textContent = 'Download';
        btn.onclick = () => downloadCanvas(makeCanvas(size), name);
        card.append(preview, sl, nl, btn);
        grid.appendChild(card);
        cards.push({ size, name });
      });

      document.getElementById('dlAll').onclick = () => {
        cards.forEach(({ size, name }) => {
          setTimeout(() => downloadCanvas(makeCanvas(size), name), 0);
        });
      };
    };

    img.src = svgUrl;
  </script>
</body>
</html>
