<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4a6da7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LHC Worship">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>LHC Worship Prep</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #4a6da7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* ── Splash screen ───────────────────────────────────────────────── */
    #splash {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(155deg, #2e4f8a 0%, #4a6da7 55%, #6b9ac4 100%);
      z-index: 200;
      padding-top: env(safe-area-inset-top);
      transition: opacity 0.55s ease, transform 0.55s ease;
    }
    #splash.fade-out { opacity: 0; transform: scale(1.04); pointer-events: none; }

    .splash-icon {
      width: 100px; height: 100px;
      filter: drop-shadow(0 10px 28px rgba(0,0,0,0.35));
      animation: breathe 2.4s ease-in-out infinite;
    }
    @keyframes breathe {
      0%,100% { transform: scale(1); }
      50%      { transform: scale(1.05); }
    }

    .splash-title {
      color: #fff;
      font-size: 1.5rem; font-weight: 700;
      letter-spacing: .04em;
      margin-top: 22px;
    }
    .splash-sub {
      color: rgba(255,255,255,.65);
      font-size: .8rem; letter-spacing: .1em;
      text-transform: uppercase;
      margin-top: 4px;
    }
    .splash-spinner {
      margin-top: 42px;
      width: 30px; height: 30px;
      border: 3px solid rgba(255,255,255,.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Offline / error banner ──────────────────────────────────────── */
    #statusBar {
      display: none;
      position: fixed; top: 0; left: 0; right: 0;
      padding: 10px 16px;
      padding-top: calc(10px + env(safe-area-inset-top));
      background: #e53e3e; color: #fff;
      font-size: .82rem; text-align: center;
      z-index: 190;
    }
    #statusBar.info { background: #4a6da7; }

    /* ── App iframe ──────────────────────────────────────────────────── */
    #appFrame {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      border: none;
      background: #f4f5fb;
    }
  </style>
</head>
<body>

  <!-- ── Splash ─────────────────────────────────────────────────────── -->
  <div id="splash">
    <svg class="splash-icon" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <rect width="512" height="512" fill="white" opacity=".12" rx="100"/>
      <rect x="220" y="76" width="72" height="360" rx="16" fill="white"/>
      <rect x="96" y="184" width="320" height="72" rx="16" fill="white"/>
      <g opacity=".38" transform="translate(302,282) scale(.9)">
        <ellipse cx="18" cy="58" rx="15" ry="11" fill="white" transform="rotate(-18,18,58)"/>
        <rect x="30" y="12" width="6" height="48" rx="3" fill="white"/>
        <path d="M36 12 Q62 6 62 28 Q62 42 36 42 Z" fill="white"/>
      </g>
    </svg>
    <div class="splash-title">LHC Worship Prep</div>
    <div class="splash-sub">Luther House Chapel</div>
    <div class="splash-spinner"></div>
  </div>

  <!-- ── Status bar ─────────────────────────────────────────────────── -->
  <div id="statusBar"></div>

  <!-- ── GAS app iframe ─────────────────────────────────────────────── -->
  <iframe
    id="appFrame"
    allow="clipboard-read; clipboard-write; microphone; camera"
    allowfullscreen
  ></iframe>

  <script>
    // ── CONFIG — replace with your deployed GAS web-app URL ──────────
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxsDkOtx25DrSROQg_eVR33RdQdPbFB3NGfhWqkCC3YIw2LLXRBKdfPaA77ljSmtpjU/exec';
    // ─────────────────────────────────────────────────────────────────

    const frame     = document.getElementById('appFrame');
    const splash    = document.getElementById('splash');
    const statusBar = document.getElementById('statusBar');

    function showStatus(msg, type) {
      statusBar.textContent = msg;
      statusBar.className = type || '';
      statusBar.style.display = 'block';
    }

    // ── Parse incoming URL params ─────────────────────────────────────
    const params = new URLSearchParams(window.location.search);

    // Web Share Target params (set by manifest share_target)
    const shareUrl   = params.get('share_url')   || '';
    const shareTitle = params.get('share_title') || '';
    const shareText  = params.get('share_text')  || '';

    // ── Build the GAS URL, forwarding all relevant params ─────────────
    function buildGasUrl() {
      const url = new URL(GAS_URL);

      // Inject share-inbox params so GAS shows the order picker
      if (shareUrl)   url.searchParams.set('shareInbox', shareUrl);
      if (shareTitle) url.searchParams.set('shareTitle', shareTitle);
      if (shareText)  url.searchParams.set('shareText',  shareText);

      // Forward existing deep-link params transparently
      ['view','order','date','dname','song','playlist','sb','media'].forEach(key => {
        if (params.has(key)) url.searchParams.set(key, params.get(key));
      });

      return url.toString();
    }

    // ── Load the app ──────────────────────────────────────────────────
    frame.src = buildGasUrl();

    // Show share notification if applicable
    if (shareUrl) {
      showStatus('📎 Sharing link to your worship order…', 'info');
    }

    // Hide splash once iframe content has loaded
    frame.addEventListener('load', () => {
      setTimeout(() => {
        splash.classList.add('fade-out');
        if (!shareUrl) statusBar.style.display = 'none';
      }, 350);
    });
    // Hard timeout in case load event doesn't fire (cross-origin)
    setTimeout(() => splash.classList.add('fade-out'), 9000);

    // ── Offline detection ─────────────────────────────────────────────
    window.addEventListener('offline', () => showStatus('You are offline. Some features may not be available.'));
    window.addEventListener('online',  () => { statusBar.style.display = 'none'; });

    // ── Messages from the GAS iframe (postMessage bridge) ────────────
    window.addEventListener('message', (event) => {
      if (!event.origin.includes('script.google.com') &&
          !event.origin.includes('googleusercontent.com')) return;
      const d = event.data;
      if (!d || typeof d !== 'object') return;
      if (d.type === 'lhc-title')  document.title = d.title || 'LHC Worship Prep';
      if (d.type === 'lhc-status') showStatus(d.message, d.level);
      if (d.type === 'lhc-status-clear') statusBar.style.display = 'none';
    });

    // ── Service worker registration ───────────────────────────────────
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/LHC-Worship-App/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
