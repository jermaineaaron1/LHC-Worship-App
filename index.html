<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4a6da7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LHC Worship">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>LHC Worship Prep</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #4a6da7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* ── Splash screen ───────────────────────────────────────────────── */
    #splash {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: linear-gradient(155deg, #2e4f8a 0%, #4a6da7 55%, #6b9ac4 100%);
      z-index: 200;
      padding-top: env(safe-area-inset-top);
      transition: opacity 0.55s ease, transform 0.55s ease;
    }
    #splash.fade-out { opacity: 0; transform: scale(1.04); pointer-events: none; }

    .splash-icon {
      width: 100px; height: 100px;
      filter: drop-shadow(0 10px 28px rgba(0,0,0,0.35));
      animation: breathe 2.4s ease-in-out infinite;
    }
    @keyframes breathe {
      0%,100% { transform: scale(1); }
      50%      { transform: scale(1.05); }
    }

    .splash-title {
      color: #fff;
      font-size: 1.5rem; font-weight: 700;
      letter-spacing: .04em;
      margin-top: 22px;
    }
    .splash-sub {
      color: rgba(255,255,255,.65);
      font-size: .8rem; letter-spacing: .1em;
      text-transform: uppercase;
      margin-top: 4px;
    }
    .splash-spinner {
      margin-top: 42px;
      width: 30px; height: 30px;
      border: 3px solid rgba(255,255,255,.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Offline / error banner ──────────────────────────────────────── */
    #statusBar {
      display: none;
      position: fixed; top: 0; left: 0; right: 0;
      padding: 10px 16px;
      padding-top: calc(10px + env(safe-area-inset-top));
      background: #e53e3e; color: #fff;
      font-size: .82rem; text-align: center;
      z-index: 190;
    }
    #statusBar.info { background: #4a6da7; }

    /* ── App iframe ──────────────────────────────────────────────────── */
    #appFrame {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      border: none;
      background: #f4f5fb;
    }

    /* ── Install prompt banner ───────────────────────────────────────── */
    #installBanner {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0;
      padding: 12px 16px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      background: #1e3a5f;
      color: #fff;
      z-index: 300;
      align-items: center; gap: 12px;
      box-shadow: 0 -2px 12px rgba(0,0,0,.25);
    }
    #installBanner.visible { display: flex; }
    .install-icon {
      width: 40px; height: 40px; flex-shrink: 0;
      background: rgba(255,255,255,.15); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem;
    }
    .install-text { flex: 1; min-width: 0; }
    .install-text strong { display: block; font-size: .88rem; }
    .install-text span { font-size: .73rem; color: rgba(255,255,255,.7); }
    .install-btn {
      background: #4a6da7; color: #fff; border: none;
      border-radius: 8px; padding: 8px 14px;
      font-size: .82rem; font-weight: 700; cursor: pointer;
      flex-shrink: 0; white-space: nowrap;
    }
    .install-dismiss {
      background: none; border: none; color: rgba(255,255,255,.55);
      font-size: 1.1rem; cursor: pointer; flex-shrink: 0; padding: 4px;
    }

    /* ── SW update banner ────────────────────────────────────────────── */
    #updateBanner {
      display: none;
      position: fixed; top: 0; left: 0; right: 0;
      padding: 10px 16px;
      padding-top: calc(10px + env(safe-area-inset-top));
      background: #0d9488; color: #fff;
      font-size: .82rem; text-align: center;
      z-index: 185; cursor: pointer;
    }
    #updateBanner.visible { display: block; }
  </style>
</head>
<body>

  <!-- ── Splash ─────────────────────────────────────────────────────── -->
  <div id="splash">
    <svg class="splash-icon" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <rect width="512" height="512" fill="white" opacity=".12" rx="100"/>
      <rect x="220" y="76" width="72" height="360" rx="16" fill="white"/>
      <rect x="96" y="184" width="320" height="72" rx="16" fill="white"/>
      <g opacity=".38" transform="translate(302,282) scale(.9)">
        <ellipse cx="18" cy="58" rx="15" ry="11" fill="white" transform="rotate(-18,18,58)"/>
        <rect x="30" y="12" width="6" height="48" rx="3" fill="white"/>
        <path d="M36 12 Q62 6 62 28 Q62 42 36 42 Z" fill="white"/>
      </g>
    </svg>
    <div class="splash-title">LHC Worship Prep</div>
    <div class="splash-sub">Luther House Chapel</div>
    <div class="splash-spinner"></div>
  </div>

  <!-- ── Status bar ─────────────────────────────────────────────────── -->
  <div id="statusBar"></div>

  <!-- ── SW update nudge ────────────────────────────────────────────── -->
  <div id="updateBanner" onclick="applySwUpdate()">
    New version available — tap to reload
  </div>

  <!-- ── Install prompt ─────────────────────────────────────────────── -->
  <div id="installBanner">
    <div class="install-icon">⛪</div>
    <div class="install-text">
      <strong>Add to Home Screen</strong>
      <span>Required so YouTube can share directly to this app</span>
    </div>
    <button class="install-btn" onclick="triggerInstall()">Install</button>
    <button class="install-dismiss" onclick="dismissInstall()" title="Dismiss">✕</button>
  </div>

  <!-- ── GAS app iframe ─────────────────────────────────────────────── -->
  <iframe
    id="appFrame"
    allow="clipboard-read; clipboard-write; microphone; camera"
    allowfullscreen
  ></iframe>

  <script>
    // ── CONFIG ────────────────────────────────────────────────────────
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxsDkOtx25DrSROQg_eVR33RdQdPbFB3NGfhWqkCC3YIw2LLXRBKdfPaA77ljSmtpjU/exec';

    const frame        = document.getElementById('appFrame');
    const splash       = document.getElementById('splash');
    const statusBar    = document.getElementById('statusBar');
    const installBanner = document.getElementById('installBanner');
    const updateBanner  = document.getElementById('updateBanner');

    function showStatus(msg, type) {
      statusBar.textContent = msg;
      statusBar.className = type || '';
      statusBar.style.display = 'block';
    }

    // ── Parse URL params ──────────────────────────────────────────────
    const params = new URLSearchParams(window.location.search);
    const shareUrl   = params.get('share_url')   || '';
    const shareTitle = params.get('share_title') || '';
    const shareText  = params.get('share_text')  || '';
    const shareFile  = params.get('shareFile')   || '';
    const shareName  = params.get('shareName')   || '';
    const shareType  = params.get('shareType')   || '';
    const shareFileTitleParam = params.get('shareTitle') || '';
    const isShare = !!(shareUrl || shareFile);

    // ── Build GAS URL ─────────────────────────────────────────────────
    function buildGasUrl() {
      const url = new URL(GAS_URL);
      if (shareUrl)   url.searchParams.set('shareInbox', shareUrl);
      if (shareTitle) url.searchParams.set('shareTitle', shareTitle);
      if (shareText)  url.searchParams.set('shareText',  shareText);
      if (isShare)    url.searchParams.set('view', 'worshipOrderView');
      ['order','date','dname','song','playlist','sb','media'].forEach(key => {
        if (params.has(key)) url.searchParams.set(key, params.get(key));
      });
      if (!isShare && params.has('view')) url.searchParams.set('view', params.get('view'));
      return url.toString();
    }

    frame.src = buildGasUrl();
    if (isShare) showStatus('Opening worship order…', 'info');

    // ── Relay share into GAS iframe via postMessage ───────────────────
    // The GAS app signals readiness with lhc-app-ready; we also retry
    // on a short interval in case the message arrives before the signal.
    function relayShareToFrame(shareData) {
      if (!shareData) return;
      let attempts = 0;
      let gasReady = false;

      // Start retrying immediately
      const relay = setInterval(() => {
        attempts++;
        if (attempts > 40) { clearInterval(relay); return; }
        try { frame.contentWindow.postMessage(shareData, '*'); } catch(e) {}
      }, 1000);

      // Once GAS app signals ready, send immediately and stop interval
      window.addEventListener('message', function onReady(ev) {
        if (ev.data && ev.data.type === 'lhc-app-ready' && !gasReady) {
          gasReady = true;
          try { frame.contentWindow.postMessage(shareData, '*'); } catch(e) {}
        }
        if (ev.data && ev.data.type === 'lhc-share-received') {
          clearInterval(relay);
          window.removeEventListener('message', onReady);
          statusBar.style.display = 'none';
        }
      });
    }

    // ── After iframe loads, dispatch share payload ────────────────────
    frame.addEventListener('load', async () => {
      setTimeout(async () => {
        splash.classList.add('fade-out');
        if (!isShare) { statusBar.style.display = 'none'; return; }

        if (shareFile) {
          try {
            const res      = await fetch('/LHC-Worship-App/pending-share-file');
            const fileData = await res.json();
            relayShareToFrame(fileData ? {
              type: 'lhc-share-file', name: fileData.name, mimeType: fileData.type,
              size: fileData.size, title: fileData.title, data: fileData.data,
              addedAt: fileData.addedAt
            } : {
              type: 'lhc-share-file', name: shareName, mimeType: shareType,
              title: shareFileTitleParam || shareName, data: null
            });
          } catch(e) {
            relayShareToFrame({ type: 'lhc-share-file', name: shareName,
              mimeType: shareType, title: shareFileTitleParam || shareName, data: null });
          }
        } else if (shareUrl) {
          relayShareToFrame({ type: 'lhc-share-inbox', url: shareUrl,
            title: shareTitle, text: shareText });
        }
      }, 300);
    });

    // Hard timeout fallback for splash
    setTimeout(() => splash.classList.add('fade-out'), 10000);

    // ── Messages from GAS iframe ──────────────────────────────────────
    window.addEventListener('message', (event) => {
      if (!event.origin.includes('script.google.com') &&
          !event.origin.includes('googleusercontent.com')) return;
      const d = event.data;
      if (!d || typeof d !== 'object') return;
      if (d.type === 'lhc-title')        document.title = d.title || 'LHC Worship Prep';
      if (d.type === 'lhc-status')       showStatus(d.message, d.level);
      if (d.type === 'lhc-status-clear') statusBar.style.display = 'none';
    });

    // ── Offline detection ─────────────────────────────────────────────
    window.addEventListener('offline', () => showStatus('You are offline — some features unavailable.'));
    window.addEventListener('online',  () => { statusBar.style.display = 'none'; });

    // ── Install prompt ────────────────────────────────────────────────
    let _deferredInstallPrompt = null;

    // Show banner if not already installed and not dismissed in this session
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      _deferredInstallPrompt = e;
      if (!sessionStorage.getItem('lhc-install-dismissed')) {
        installBanner.classList.add('visible');
      }
    });

    // Hide banner if the user installs via OS prompt (not our button)
    window.addEventListener('appinstalled', () => {
      installBanner.classList.remove('visible');
      _deferredInstallPrompt = null;
    });

    function triggerInstall() {
      if (!_deferredInstallPrompt) return;
      _deferredInstallPrompt.prompt();
      _deferredInstallPrompt.userChoice.then(({ outcome }) => {
        installBanner.classList.remove('visible');
        _deferredInstallPrompt = null;
      });
    }

    function dismissInstall() {
      sessionStorage.setItem('lhc-install-dismissed', '1');
      installBanner.classList.remove('visible');
    }

    // ── SW registration, update detection, keepalive ─────────────────
    let _swRegistration = null;

    function applySwUpdate() {
      if (_swRegistration && _swRegistration.waiting) {
        _swRegistration.waiting.postMessage({ type: 'skipWaiting' });
      }
      updateBanner.classList.remove('visible');
      location.reload();
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/LHC-Worship-App/sw.js', { scope: '/LHC-Worship-App/' })
        .then(reg => {
          _swRegistration = reg;

          // Detect when a new SW is waiting (user needs to reload to get update)
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            if (!newWorker) return;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                updateBanner.classList.add('visible');
              }
            });
          });

          // Register Periodic Background Sync (keeps SW in OS share target registry)
          if ('periodicSync' in reg) {
            Notification.requestPermission().then(() => {}).catch(() => {});
            reg.periodicSync.register('lhc-heartbeat', {
              minInterval: 24 * 60 * 60 * 1000  // once a day
            }).catch(() => {});
          }
        })
        .catch(() => {});

      // Reload automatically when a new SW takes control
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (document._swUpdating) return;
        document._swUpdating = true;
        location.reload();
      });

      // ── SW keepalive: ping the SW whenever the tab is visible ─────────
      // Receiving messages prevents the OS from killing an idle SW, which
      // ensures the app stays registered in the share target list.
      function pingSW() {
        if (!navigator.serviceWorker.controller) return;
        const ch = new MessageChannel();
        navigator.serviceWorker.controller.postMessage({ type: 'ping' }, [ch.port2]);
      }

      // Ping on page load and whenever the user switches back to the app
      pingSW();
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') pingSW();
      });

      // Ping every 20 minutes so the SW stays registered while the tab is open
      setInterval(pingSW, 20 * 60 * 1000);
    }
  </script>
</body>
</html>
